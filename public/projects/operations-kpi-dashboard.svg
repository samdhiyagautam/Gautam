<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)" />

  <!-- Top Navigation Bar -->
  <rect width="1200" height="70" fill="#1e293b" />
  <text x="40" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold">Operational Performance &amp; Executive KPI Dashboard</text>
  <rect x="1010" y="20" width="150" height="32" rx="6" fill="#334155" />
  <text x="1030" y="41" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">Power BI · Scheduled</text>

  <!-- KPI Cards -->
  <!-- Card 1 -->
  <rect x="40" y="100" width="260" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="65" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">TASK RESOLUTION RATE</text>
  <text x="65" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="bold">94.8%</text>
  <text x="180" y="180" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="600">+12.4% MoM</text>

  <!-- Card 2 -->
  <rect x="330" y="100" width="260" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="355" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">AVG TURNAROUND TIME</text>
  <text x="355" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="bold">3.2 hrs</text>
  <text x="485" y="180" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="600">-45% Delay</text>

  <!-- Card 3 -->
  <rect x="620" y="100" width="260" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="645" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">REPORT COMPILATION</text>
  <text x="645" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="bold">[METRIC]</text>
  <text x="795" y="180" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Automated</text>

  <!-- Card 4 -->
  <rect x="910" y="100" width="250" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="935" y="135" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">DATA AUDIT INTEGRITY</text>
  <text x="935" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="32" font-weight="bold">99.9%</text>
  <text x="1060" y="180" fill="#22c55e" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Verified</text>

  <!-- Chart 1: Main Trend Line -->
  <rect x="40" y="240" width="670" height="395" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="65" y="275" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Monthly Operations Throughput vs SLA Targets</text>
  <!-- Grid Lines -->
  <line x1="65" y1="330" x2="685" y2="330" stroke="#334155" stroke-dasharray="4" />
  <line x1="65" y1="400" x2="685" y2="400" stroke="#334155" stroke-dasharray="4" />
  <line x1="65" y1="470" x2="685" y2="470" stroke="#334155" stroke-dasharray="4" />
  <line x1="65" y1="540" x2="685" y2="540" stroke="#334155" stroke-dasharray="4" />
  <!-- Area & Line -->
  <path d="M 90 520 Q 180 490 270 420 T 450 380 T 560 320 T 660 300 L 660 580 L 90 580 Z" fill="url(#primaryGrad)" opacity="0.2" />
  <path d="M 90 520 Q 180 490 270 420 T 450 380 T 560 320 T 660 300" fill="none" stroke="#38bdf8" stroke-width="4" />
  <!-- SLA Target Line -->
  <line x1="90" y1="360" x2="660" y2="360" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6" />
  <text x="560" y="350" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="11">SLA Target (85%)</text>

  <!-- Chart 2: Category Breakdown -->
  <rect x="740" y="240" width="420" height="395" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="765" y="275" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="bold">Departmental Workload Distribution</text>
  <!-- Bar 1 -->
  <text x="765" y="330" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Operations</text>
  <rect x="765" y="340" width="280" height="24" rx="4" fill="url(#barGrad)" />
  <text x="1060" y="357" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">38%</text>
  <!-- Bar 2 -->
  <text x="765" y="395" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Reporting &amp; MIS</text>
  <rect x="765" y="405" width="210" height="24" rx="4" fill="url(#barGrad)" />
  <text x="990" y="422" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">27%</text>
  <!-- Bar 3 -->
  <text x="765" y="460" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Quality Assurance</text>
  <rect x="765" y="470" width="160" height="24" rx="4" fill="url(#barGrad)" />
  <text x="940" y="487" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">21%</text>
  <!-- Bar 4 -->
  <text x="765" y="525" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">Data Ingestion</text>
  <rect x="765" y="535" width="110" height="24" rx="4" fill="url(#barGrad)" />
  <text x="890" y="552" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600">14%</text>
</svg>
